[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-author-searcher"
version = "0.1.0"
description = "Evidence-based professor identity resolution across scholarly indexes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
download = ["pypdf>=5.9,<6", "pdfminer.six>=20250506"]
# Optional identity adjudication with Claude (Anthropic SDK 1.x).
llm = ["anthropic>=1"]
# The gRPC front end (paper-search-api serve-grpc). The committed generated code needs these runtimes or newer.
grpc = ["grpcio>=1.71,<2", "grpcio-health-checking>=1.71,<2", "protobuf>=5.29,<6"]
# The MCP front end (paper-search-api serve-mcp): the official SDK and its ASGI server.
mcp = ["mcp>=2.3,<3", "uvicorn>=0.31"]
dev = ["grpcio-tools==1.71.0", "ruff==0.8.6", "mypy==1.14.1", "pre-commit==3.5.0", "coverage[toml]==7.6.1", "hypothesis==6.113.0"]

[project.scripts]
professor-resolve = "paper_author_searcher.cli:main"
paper-evaluate = "paper_author_searcher.evaluation_cli:main"
pdf-resolve = "paper_author_searcher.pdf_cli:main"
pdf-download = "paper_author_searcher.download_cli:main"
paper-search = "paper_author_searcher.workflow_cli:main"
paper-dblp-index = "paper_author_searcher.dblp_cli:main"
paper-catalog-index = "paper_author_searcher.catalog_cli:main"
paper-performance = "paper_author_searcher.performance_cli:main"
paper-benchmark = "paper_author_searcher.benchmark.cli:main"
paper-search-api = "paper_author_searcher.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_author_searcher = ["data/*.txt", "api/schemas/*/*.json", "api/static/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = ["output", "data", "reports", "tmp", "src/paper_author_searcher/rpc/v1"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PIE", "RET", "TID", "PLR2004"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # non-ASCII text is intentional (author names, Chinese docs)
    "SIM108",                       # ternaries are not always clearer
    "RET504", "RET505",             # explicit assignments before return/else aid readability here
]

[tool.ruff.lint.isort]
known-first-party = ["paper_author_searcher"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# Nested mock.patch blocks in tests read better than one combined `with`.
"tests/**" = ["SIM117", "PLR2004"]
"scripts/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
# Optional extras ("download", "llm") are imported lazily and have no stubs here.
module = ["pypdf", "pypdf.*", "pdfminer", "pdfminer.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated by protoc (scripts/ci/generate_grpc.py); grpc ships no type stubs.
module = ["paper_author_searcher.rpc.v1.*", "grpc", "grpc.*", "grpc_health.*", "grpc_tools.*", "google.protobuf.*", "uvicorn", "mcp", "mcp.*", "pydantic", "starlette.*", "httpx2"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
# Being restructured (resolver/anchor split); they are annotated as they are split.
module = [
    "paper_author_searcher.identity_anchors",
    "paper_author_searcher.resolver",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
branch = true
source = ["src/paper_author_searcher"]

[tool.coverage.report]
# Whole package: no regression below today's level. Core domain modules have their own, higher gate in CI.
fail_under = 84
skip_covered = true
